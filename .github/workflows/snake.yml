name: Generate Snake Animation

# Generates an animated SVG of a snake eating your contribution graph,
# then pushes the result to the `output` branch where the README reads it from.

on:
  # Re-generate on a schedule (every 12 hours) so the snake stays fresh.
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Re-generate whenever you push to main.
  push:
    branches:
      - main

# The job needs write access to push the generated SVG to the output branch.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#6366f1&color_dots=#0b1120,#1e3a8a,#3b82f6,#6366f1,#a5b4fc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
